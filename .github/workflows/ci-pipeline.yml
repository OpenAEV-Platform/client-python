name: "[Client Python] CI"

on:
  push:
    branches:
      - "main"
      # Temporary
      - "ci/391-migrate-ci-pipeline-from-circleci-to-github-actions"
    tags:
      - "*"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Lint & Format
  # ──────────────────────────────────────────────────────────────────
  lint-format:
    name: Lint & Format
    uses: $/.github/workflows/ci-lint-format.yml

  # ──────────────────────────────────────────────────────────────────
  # Tests
  # ──────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: $/.github/actions/checkout

      - name: Setup Python Environment
        uses: $/.github/actions/setup-python

      - name: Run Tests
        run: python -m pytest

  # ──────────────────────────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    needs:
      - lint-format
      - tests

    steps:
      - name: Checkout Repository
        uses: $/.github/actions/checkout

      - name: Setup Python Environment
        uses: $/.github/actions/setup-python

      - name: Check Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(
            python -c 'import pyoaev; print(pyoaev.__version__)'
          )"

          tag_version="${GITHUB_REF_NAME}"
          if [ "${tag_version}" != "${package_version}" ]; then
            echo "::error::Version mismatch: Git tag version '${tag_version}' does not match package version '${package_version}'."
            exit 1
          fi

      - name: Build Package
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python -m build

      # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      - name: Upload Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyoaev-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────
  # Pipeline Gate
  # Required branch-protection check: "Pipeline Gate"
  # Fails if any mandatory upstream job did not succeed.
  # ──────────────────────────────────────────────────────────────────
  pipeline-gate:
    name: "Pipeline Gate"
    needs:
      - lint-format
      - tests
      - build
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read

    steps:
      - name: Check all upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail

          FAILED=0
          TOTAL=0

          echo "══════════════════════════════════════════════════"
          echo "  🔎 Upstream Job Results"
          echo "══════════════════════════════════════════════════"
          echo ""

          # Retrieve actual job timestamps from GitHub API
          JOBS_JSON=$(curl -fsSL \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "$GH_API_URL/repos/$GH_REPOSITORY/actions/runs/$GH_RUN_ID/jobs?per_page=100")

          # Initialize GitHub Actions Summary
          {
            echo "## Upstream Job Results"
            echo ""
            echo "| Job | Started | Finished | Duration | Status |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # Dynamically iterate over all jobs declared in needs
          for job in $(jq -r 'keys[]' <<< "$NEEDS_JSON"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<< "$NEEDS_JSON")
            TOTAL=$((TOTAL + 1))

            case "$result" in
              success)
                icon="✅"
                status="Passed"
                ;;
              skipped)
                icon="⏭️"
                status="Skipped"
                FAILED=$((FAILED + 1))
                ;;
              failure)
                icon="❌"
                status="Failed"
                FAILED=$((FAILED + 1))
                ;;
              cancelled)
                icon="🚫"
                status="Cancelled"
                FAILED=$((FAILED + 1))
                ;;
              *)
                icon="❓"
                status="Unknown"
                FAILED=$((FAILED + 1))
                ;;
            esac
          
            started_at=""
            finished_at=""
            started="—"
            finished="—"
            duration="—"
  
            # Find corresponding job in GitHub API response
            job_data=$(jq -c \
              --arg name "$job" \
              '.jobs | map(select(.name == $name)) | first // empty' \
              <<< "$JOBS_JSON")
  
            if [[ -n "$job_data" ]]; then
              started_at=$(jq -r '.started_at // empty' <<< "$job_data")
              finished_at=$(jq -r '.completed_at // empty' <<< "$job_data")
            fi
  
            # Format start timestamp
            if [[ -n "$started_at" ]]; then
              started=$(date -u -d "$started_at" '+%Y-%m-%d %H:%M:%S UTC')
            fi
  
            # Format finish timestamp
            if [[ -n "$finished_at" ]]; then
              finished=$(date -u -d "$finished_at" '+%Y-%m-%d %H:%M:%S UTC')
            fi
  
            # Calculate job duration
            if [[ -n "$started_at" && -n "$finished_at" ]]; then
              start_epoch=$(date -u -d "$started_at" +%s)
              finish_epoch=$(date -u -d "$finished_at" +%s)
              duration_seconds=$((finish_epoch - start_epoch))
  
              duration=$(printf '%02dm %02ds' \
                $((duration_seconds / 60)) \
                $((duration_seconds % 60)))
            fi
  
            # Display result in workflow logs
            printf "  %s  %-30s %s\n" "$icon" "$job" "$result"
  
            # Add result to GitHub Actions Summary
            printf "| %s %s | %s | %s | %s | %s |\n" \
              "$icon" "$job" "$started" "$finished" "$duration" "$status" \
              >> "$GITHUB_STEP_SUMMARY"
  
          done

          echo ""
          echo "══════════════════════════════════════════════════"

          if [[ "$FAILED" -gt 0 ]]; then
            echo "❌ Gate failed: $FAILED/$TOTAL job(s) did not succeed."

            {
              echo ""
              echo "**❌ Gate failed: $FAILED/$TOTAL required job(s) did not succeed.**"
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "✅ All $TOTAL upstream jobs succeeded."
          echo "✅ Pipeline Gate passed."

          {
            echo ""
            echo "**✅ All $TOTAL upstream jobs succeeded.**"
            echo ""
            echo "### Pipeline Gate: Passed"
          } >> "$GITHUB_STEP_SUMMARY"